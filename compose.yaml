name: solva-pos
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Defaults are for local development only; set real values in the deploy environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      # Optional: replace the development passwords of the application roles on first init.
      SOLVA_OWNER_PASSWORD: ${SOLVA_OWNER_PASSWORD:-}
      SOLVA_APP_PASSWORD: ${SOLVA_APP_PASSWORD:-}
    ports:
      - "127.0.0.1:${SOLVA_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
      - ./docker/rotate-role-passwords.sh:/docker-entrypoint-initdb.d/15-rotate-role-passwords.sh:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/20-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    image: ${SOLVA_APP_IMAGE:-solva-pos:latest}
    profiles: ["full"]
    command: ["node", "dist/ops/db-migrate.mjs"]
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?DATABASE_OWNER_URL is required}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${SOLVA_APP_IMAGE:-solva-pos:latest}
    profiles: ["full"]
    user: node
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      SYNC_TOKEN_SECRET: ${SYNC_TOKEN_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - logs:/app/logs
      - assets:/app/assets
      - sourcemaps:/app/sourcemaps
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "dist/ops/health-check.mjs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  proxy:
    image: nginx:stable
    profiles: ["full"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  logs:
  assets:
  sourcemaps:
