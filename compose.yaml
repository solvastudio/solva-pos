name: solva-pos
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local dev only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${SOLVA_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/20-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
