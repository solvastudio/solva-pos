worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  client_max_body_size 2m;
  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

  limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=anon:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=connperip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream app {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Tenant-Slug "";

    location = / {
      return 404;
    }

    location ~* \.map$ {
      return 404;
    }

    location = /health {
      proxy_pass http://app;
    }

    location = /sw.js {
      add_header Cache-Control "no-cache";
      proxy_pass http://app;
    }

    location ~ ^/[^/]+/pos/manifest\.webmanifest$ {
      add_header Cache-Control "no-cache";
      proxy_pass http://app;
    }

    location ^~ /assets/ {
      location ~* \.map$ {
        return 404;
      }
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_pass http://app;
    }

    # SSE stream stays exempt from general connection and request rate limits.
    location ^~ /api/pos/v1/signals {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_pass http://app;
    }

    location ^~ /api/pos/v1/enroll {
      limit_req zone=anon burst=10 nodelay;
      proxy_pass http://app;
    }

    location ^~ /api/ {
      limit_req zone=general burst=100 nodelay;
      limit_conn connperip 50;
      proxy_pass http://app;
    }

    location ^~ /platform/ {
      limit_req zone=anon burst=10 nodelay;
      proxy_pass http://app;
    }

    location ~ ^/[^/]+/(?:api/)?(join|reset)$ {
      limit_req zone=anon burst=10 nodelay;
      proxy_pass http://app;
    }

    location ~ ^/[^/]+/admin/(login|api/auth/sign-in/email|api/auth/login)$ {
      limit_req zone=anon burst=10 nodelay;
      proxy_pass http://app;
    }

    location ~ ^/([^/]+)/_serverFn/ {
      set $tslug $1;
      limit_req zone=general burst=100 nodelay;
      limit_conn connperip 50;
      rewrite ^/[^/]+/_serverFn/(.*)$ /_serverFn/$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $tslug;
      proxy_pass http://app;
    }

    location / {
      limit_req zone=general burst=100 nodelay;
      limit_conn connperip 50;
      proxy_pass http://app;
    }
  }
}
