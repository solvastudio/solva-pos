worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  client_max_body_size 2m;
  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

  limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=anon:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=connperip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream app {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/solva-pos/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solva-pos/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Tenant-Slug "";

    location = / {
      return 404;
    }

    location ~* \.map$ {
      return 404;
    }

    location = /health {
      proxy_pass http://app;
    }

    location = /sw.js {
      add_header Cache-Control "no-cache";
      proxy_pass http://app;
    }

    location ^~ /assets/ {
      location ~* \.map$ {
        return 404;
      }
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_pass http://app;
    }

    location ^~ /api/pos/v1/signals {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Tenant-Slug "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_pass http://app;
    }

    location ^~ /api/pos/v1/enroll {
      limit_req zone=anon burst=10 nodelay;
      proxy_pass http://app;
    }

    location ^~ /api/ {
      limit_req zone=general burst=100 nodelay;
      limit_conn connperip 50;
      proxy_pass http://app;
    }

    location ^~ /platform/ {
      limit_req zone=anon burst=10 nodelay;
      proxy_pass http://app;
    }

    location ~ ^/[^/]+/(?:api/)?(join|reset)$ {
      limit_req zone=anon burst=10 nodelay;
      proxy_pass http://app;
    }

    location ~ ^/[^/]+/admin/(login|api/auth/sign-in/email|api/auth/login)$ {
      limit_req zone=anon burst=10 nodelay;
      proxy_pass http://app;
    }

    location / {
      limit_req zone=general burst=100 nodelay;
      limit_conn connperip 50;
      proxy_pass http://app;
    }
  }
}
