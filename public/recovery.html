<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solva POS — Recovery</title>
  <!--
    T-01 Static-file token exception:
    public/recovery.html is served as a zero-bundle static emergency fallback (SCR-S04)
    so it cannot import compiled Tailwind/tokens.css. Colors below are exact literals copied
    from src/styles/tokens.css (--color-primary-700 #46780D, --color-neutral-50 #F4F5F6,
    --color-neutral-0 #FFFFFF, --color-neutral-900 #1B1D21, --color-neutral-600 #52565F,
    --color-neutral-200 #DEDFE3, --color-danger-ink #B42318, --color-danger-soft #FDECEC).
    This file is exempt in tests/arch/token-guard.test.ts.
  -->
  <style>
    :root {
      color-scheme: light;
      --bg: #F4F5F6;
      --card: #FFFFFF;
      --ink: #1B1D21;
      --ink-soft: #52565F;
      --line: #DEDFE3;
      --primary: #46780D;
      --primary-ink: #FFFFFF;
      --danger: #B42318;
      --danger-soft: #FDECEC;
      --sunken: #ECEDEF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(15, 16, 18, 0.08);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
    }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { margin: 0 0 16px; color: var(--ink-soft); line-height: 1.5; font-size: 15px; }
    .codebox {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--sunken);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button, .btn {
      width: 100%;
      min-height: 48px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
    }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-ink);
    }
    button.danger {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }
    .reset-panel {
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      display: none;
    }
    .reset-panel.open { display: block; }
    input[type="text"] {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 15px;
      margin: 8px 0 10px;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--ink-soft);
      min-height: 20px;
    }
  </style>
</head>
<body>
  <main role="main">
    <span class="badge" id="brand-badge">Solva POS</span>
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="codebox" id="error-code"></div>

    <div class="actions">
      <button type="button" class="primary" id="btn-retry"></button>
      <button type="button" id="btn-export"></button>
      <button type="button" class="danger" id="btn-reset-toggle"></button>
    </div>

    <section class="reset-panel" id="reset-panel" aria-live="polite">
      <p id="reset-prompt"></p>
      <input type="text" id="reset-input" placeholder="RESET" autocomplete="off" />
      <button type="button" class="danger" id="btn-reset-confirm"></button>
    </section>

    <p class="status" id="status-msg" role="status" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      var isEn = (navigator.language || 'id').toLowerCase().indexOf('en') === 0;
      document.documentElement.lang = isEn ? 'en' : 'id';

      var copy = isEn ? {
        title: 'App could not start',
        body: 'The POS shell failed to boot. Pending transactions on this device remain safe.',
        retry: 'Retry',
        exportBtn: 'Export pending transactions',
        noPending: 'No pending transactions found on this device.',
        exported: 'Pending transactions exported: ',
        resetBtn: 'Reset app',
        resetPrompt: 'Type RESET to unregister this tenant service worker and clear unshared app cache without touching IndexedDB or credentials:',
        resetConfirmBtn: 'Confirm reset',
        resetDone: 'App cache reset. Reloading...',
        resetInvalid: 'Type RESET exactly to confirm.'
      } : {
        title: 'Aplikasi tidak dapat dimulai',
        body: 'Shell kasir gagal dimuat. Transaksi tertunda di perangkat ini tetap aman.',
        retry: 'Coba lagi',
        exportBtn: 'Ekspor transaksi tertunda',
        noPending: 'Tidak ada transaksi tertunda di perangkat ini.',
        exported: 'Transaksi tertunda diekspor: ',
        resetBtn: 'Reset aplikasi',
        resetPrompt: 'Ketik RESET untuk mencabut service worker tenant ini dan membersihkan cache tanpa menghapus IndexedDB atau kredensial:',
        resetConfirmBtn: 'Konfirmasi reset',
        resetDone: 'Cache aplikasi direset. Memuat ulang...',
        resetInvalid: 'Ketik RESET persis untuk konfirmasi.'
      };

      function makeLocalRef() {
        var d = new Date();
        function pad(n) { return String(n).padStart(2, '0'); }
        var day = d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate());
        var tm = pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds());
        var alpha = 'abcdefghjkmnpqrstuvwxyz23456789';
        var rnd = '';
        for (var i = 0; i < 5; i++) {
          rnd += alpha[Math.floor(Math.random() * alpha.length)];
        }
        return 'D-' + day + '-' + tm + '-' + rnd;
      }

      var params = new URLSearchParams(window.location.search);
      var code = (params.get('code') || 'APP_ERROR').toUpperCase();
      var ref = params.get('ref') || makeLocalRef();
      var segments = window.location.pathname.split('/').filter(Boolean);
      var slug = segments.length > 0 && segments[0] !== 'recovery.html' ? segments[0] : '';

      document.getElementById('title').textContent = copy.title;
      document.getElementById('body').textContent = copy.body;
      document.getElementById('error-code').textContent = code + '#' + ref.toLowerCase();
      document.getElementById('btn-retry').textContent = copy.retry;
      document.getElementById('btn-export').textContent = copy.exportBtn;
      document.getElementById('btn-reset-toggle').textContent = copy.resetBtn;
      document.getElementById('reset-prompt').textContent = copy.resetPrompt;
      document.getElementById('btn-reset-confirm').textContent = copy.resetConfirmBtn;

      var statusEl = document.getElementById('status-msg');

      document.getElementById('btn-retry').addEventListener('click', function () {
        if (slug) {
          window.location.href = '/' + slug + '/pos/';
        } else {
          window.location.reload();
        }
      });

      function openDbIfExists(name) {
        return new Promise(function (resolve) {
          if (!window.indexedDB || typeof window.indexedDB.databases !== 'function') {
            resolve(null);
            return;
          }
          window.indexedDB.databases().then(function (list) {
            var found = list.some(function (db) { return db && db.name === name; });
            if (!found) {
              resolve(null);
              return;
            }
            var req = window.indexedDB.open(name);
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { resolve(null); };
          }).catch(function () { resolve(null); });
        });
      }

      function readAllStoreRecords(db, storeName) {
        return new Promise(function (resolve) {
          if (!db || !db.objectStoreNames.contains(storeName)) {
            resolve([]);
            return;
          }
          try {
            var tx = db.transaction(storeName, 'readonly');
            var req = tx.objectStore(storeName).getAll();
            req.onsuccess = function () { resolve(req.result || []); };
            req.onerror = function () { resolve([]); };
          } catch (_e) {
            resolve([]);
          }
        });
      }

      async function sha256Hex(text) {
        try {
          if (!window.crypto || !window.crypto.subtle || typeof TextEncoder === 'undefined') {
            return '';
          }
          var buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
          return Array.from(new Uint8Array(buf)).map(function (b) {
            return b.toString(16).padStart(2, '0');
          }).join('');
        } catch (_e) {
          return '';
        }
      }

      document.getElementById('btn-export').addEventListener('click', async function () {
        var registryDb = await openDbIfExists('solva-registry');
        if (!registryDb) {
          statusEl.textContent = copy.noPending;
          return;
        }
        var tenants = await readAllStoreRecords(registryDb, 'tenant_directory');
        registryDb.close();
        var matched = tenants.find(function (t) { return t && t.slug === slug; });
        var tenantId = matched && matched.tenant_id ? matched.tenant_id : null;
        if (!tenantId) {
          statusEl.textContent = copy.noPending;
          return;
        }
        var tenantDb = await openDbIfExists('solva-pos:' + tenantId);
        if (!tenantDb) {
          statusEl.textContent = copy.noPending;
          return;
        }
        var outbox = await readAllStoreRecords(tenantDb, 'outbox_command');
        var metaRows = await readAllStoreRecords(tenantDb, 'meta');
        tenantDb.close();
        var deviceMeta = null;
        var clockMeta = null;
        for (var m = 0; m < metaRows.length; m++) {
          if (metaRows[m] && metaRows[m].key === 'device') deviceMeta = metaRows[m].value;
          if (metaRows[m] && metaRows[m].key === 'clock') clockMeta = metaRows[m].value;
        }
        var pending = outbox
          .filter(function (row) {
            return row && row.status !== 'ACKED' && row.status !== 'DISMISSED';
          })
          .sort(function (a, b) {
            return (a.device_seq || 0) - (b.device_seq || 0);
          });
        if (pending.length === 0) {
          statusEl.textContent = copy.noPending;
          return;
        }
        var commandLines = pending.map(function (row) {
          return JSON.stringify({
            id: row.id,
            type: row.type,
            schema_version: row.schema_version,
            device_seq: row.device_seq,
            register_id: row.register_id,
            status: row.status,
            dependency_key: row.dependency_key,
            depends_on: row.depends_on,
            attempts: row.attempts,
            last_error_class: row.last_error_class,
            last_error_code: row.last_error_code,
            last_error_ref: row.last_error_ref,
            created_at_device: row.created_at_device,
            app_version: row.app_version,
            payload: row.payload
          });
        });
        var bodyText = commandLines.join('\n');
        var hash = await sha256Hex(bodyText);
        var offsetMs = clockMeta && typeof clockMeta.offset_ms === 'number' ? clockMeta.offset_ms : 0;
        var exportedAt = new Date(Date.now() + offsetMs).toISOString();
        var devId = (deviceMeta && deviceMeta.device_id) || (slug || 'recovery-device');
        var regId = (deviceMeta && deviceMeta.register_id) || 'unknown-register';
        var header = JSON.stringify({
          device_id: devId,
          register_id: regId,
          app_version: (pending[0] && pending[0].app_version) || 'recovery',
          schema_version: (pending[0] && pending[0].schema_version) || 1,
          exported_at: exportedAt,
          count: pending.length,
          sha256: hash
        });
        var jsonl = header + '\n' + bodyText + '\n';
        var blob = new Blob([jsonl], { type: 'application/x-ndjson' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        var utcStamp = exportedAt.replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
        a.download = 'solva-pending_' + devId + '_' + utcStamp + '.jsonl';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        statusEl.textContent = copy.exported + pending.length;
      });

      document.getElementById('btn-reset-toggle').addEventListener('click', function () {
        document.getElementById('reset-panel').classList.toggle('open');
      });

      document.getElementById('btn-reset-confirm').addEventListener('click', async function () {
        var val = (document.getElementById('reset-input').value || '').trim();
        if (val !== 'RESET') {
          statusEl.textContent = copy.resetInvalid;
          return;
        }

        // Remove only this scope's manifest & unshared precache entries; NEVER touch IndexedDB/keys/cookies.
        var scopePath = slug ? '/' + slug + '/pos/' : window.location.pathname;
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) {
            var reg = regs[i];
            if (!slug || reg.scope.indexOf(scopePath) !== -1) {
              var scopeUrl = reg.scope;
              if ('caches' in window) {
                var mCache = await caches.open('solva-manifests');
                await mCache.delete('/__manifest/' + encodeURIComponent(scopeUrl));
                var metaCache = await caches.open('solva-meta');
                await metaCache.delete('/__lastgood/' + encodeURIComponent(scopeUrl));

                var keys = await mCache.keys();
                var union = new Set();
                for (var k = 0; k < keys.length; k++) {
                  var mRes = await mCache.match(keys[k]);
                  if (mRes) {
                    var parsed = await mRes.json();
                    var list = Array.isArray(parsed) ? parsed : (parsed && parsed.urls) || [];
                    for (var u = 0; u < list.length; u++) union.add(list[u]);
                  }
                }
                var pCache = await caches.open('solva-precache');
                var pKeys = await pCache.keys();
                for (var p = 0; p < pKeys.length; p++) {
                  if (!union.has(pKeys[p].url)) {
                    await pCache.delete(pKeys[p]);
                  }
                }
              }
              await reg.unregister();
            }
          }
        }

        statusEl.textContent = copy.resetDone;
        setTimeout(function () {
          if (slug) {
            window.location.href = '/' + slug + '/pos/';
          } else {
            window.location.reload();
          }
        }, 400);
      });
    })();
  </script>
</body>
</html>
